name: Ensure Pay DNS

# One-shot: creates a proxied DNS record for pay.mitumba.africa so the
# edge Worker route (pay.mitumba.africa/*) can intercept traffic. Proxied
# AAAA -> 100:: is a standard "the Worker answers, origin is never hit" record.
# Run manually via workflow_dispatch.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ensure-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Create proxied DNS record if missing
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ZONE_NAME: mitumba.africa
          RECORD_NAME: pay.mitumba.africa
        run: |
          set -euo pipefail

          zone_id=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result'][0]['id'] if d.get('result') else '')")

          if [ -z "$zone_id" ]; then
            echo "Could not resolve zone id for ${ZONE_NAME}. Check token zone permissions."
            exit 1
          fi
          echo "Zone: ${ZONE_NAME} -> ${zone_id}"

          existing=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=${RECORD_NAME}" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(len(d.get('result') or []))")

          if [ "$existing" != "0" ]; then
            echo "DNS record for ${RECORD_NAME} already exists. Nothing to do."
            exit 0
          fi

          echo "Creating proxied AAAA ${RECORD_NAME} -> 100:: ..."
          resp=$(curl -s -X POST -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" \
            --data '{"type":"AAAA","name":"'"${RECORD_NAME}"'","content":"100::","proxied":true,"ttl":1}')

          echo "$resp" | python3 -c "import sys,json;d=json.load(sys.stdin);print('OK' if d.get('success') else 'FAILED: '+json.dumps(d.get('errors')))"
